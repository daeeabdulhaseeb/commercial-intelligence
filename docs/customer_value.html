header{padding:18px 20px 8px}h1{font-size:20px;margin:0}header p{margin:4px 0 0;color:var(--mute)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 20px}
select,button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit}

main{padding:16px 20px 40px;max-width:1300px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.k{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}.k b{display:block;font-size:20px}.k span{color:var(--mute);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.card h3{margin:0 0 4px;font-size:15px}.card .sub{color:var(--mute);font-size:12px;margin:0 0 10px}
.cv{position:relative;height:280px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}th{color:var(--mute);font-weight:600;cursor:pointer}
.tw{overflow-x:auto}.chip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;color:#fff}
.heat td{text-align:center;font-size:12px;padding:8px 4px;border:1px solid var(--bg)}
.view{display:none}.view.on{display:block}
.note{background:var(--chip);border-radius:8px;padding:10px 12px;color:var(--ink);font-size:13px;margin-bottom:14px}
td:has(.act),.act{font-size:12px;color:var(--mute);text-align:left}
@media(max-width:600px){.grid{grid-template-columns:1fr}header,main,.bar,nav{padding-left:16px;padding-right:16px}}

 document.getElementById('v-cltv').innerHTML='<div class="note">CLTV = forward gross profit: annual GP (last 12m, or half of prior 12m if nothing recent) × r ÷ (1 + d − r). Retention r from recency (≤3m 85% … >18m 5%), discount d 12%, GP from assumed product-group margins ('+Object.entries(GM).map(e=>e[0]+' '+pct(e[1])).join(', ')+'). Historical GP shown for comparison.</div>'+
 '<div class="grid"><div class="card"><h3>CLTV distribution</h3><p class="sub">customers and total CLTV by band</p><div class="cv"><canvas id="c4"></canvas></div></div>'+
 '<div class="card"><h3>CLTV by RFM segment</h3><p class="sub">where future value sits</p><div class="cv"><canvas id="c5"></canvas></div></div></div>'+
 '<div class="card" style="margin-top:14px"><h3>Top 25 customers by CLTV</h3>'+table(top.slice(0,25),[['Customer',r=>nm(r)],['Team',r=>C[r.c].team],['Segment',r=>chip(r.seg)],['Last 12m',r=>fmt(r.m12)],['Hist. GP',r=>fmt(r.hist)],['Retention',r=>pct(r.ret)],['CLTV',r=>'<b>'+fmt(r.cltv)+'</b>']])+'</div>';
 chart('c4',{type:'bar',data:{labels:['<10K','10–50K','50–150K','150–500K','500K+'],datasets:[{label:'Customers',data:bands.map(b=>L.filter(o=>o.cltv>=b[0]&&o.cltv<b[1]).length),backgroundColor:css('--acc'),yAxisID:'y'},{label:'Total CLTV',type:'line',data:bands.map(b=>L.filter(o=>o.cltv>=b[0]&&o.cltv<b[1]).reduce((s,o)=>s+o.cltv,0)),borderColor:css('--good'),yAxisID:'y1'}]},
  options:{maintainAspectRatio:false,scales:{y1:{position:'right',grid:{display:false},ticks:{callback:v=>fmt(v)}}}}});
 chart('c5',{type:'doughnut',data:{labels:order,datasets:[{data:order.map(s=>G[s].cltv),backgroundColor:order.map(s=>SEG[s])}]},options:{maintainAspectRatio:false,plugins:{legend:{position:'right'},tooltip:{callbacks:{label:c=>c.label+': '+fmt(c.raw)}}}}});
 /* CVM */
 const prev=(()=>{const P=model(D.asof-100);const m={};P.L.forEach(o=>m[o.c]=o.seg);return m})();
 const S=['Champions','Loyal','Potential Loyalist','New','Need Attention','At Risk','Cannot Lose','Hibernating','Lost'];
 const sg=s=>S.includes(s)?s:s==='Promising'?'New':s==='About to Sleep'?'Need Attention':s;
 let mig='<table class="heat"><tr><td><b>last yr ↓ / now →</b></td>'+S.map(s=>'<td style="font-size:11px"><b>'+s+'</b></td>').join('')+'</tr>';
 S.forEach(a=>{mig+='<tr><td style="text-align:left"><b>'+a+'</b></td>';const row=L.filter(o=>prev[o.c]&&sg(prev[o.c])===a);S.forEach(b=>{const n=row.filter(o=>sg(o.seg)===b).length;
  const good=S.indexOf(b)<S.indexOf(a),bad=S.indexOf(b)>S.indexOf(a);const al=row.length?n/row.length:0;
  mig+='<td style="background:'+(n?(good?'rgba(46,125,82,':bad?'rgba(192,57,47,':'rgba(120,130,150,')+(.12+al*.8).toFixed(2)+')':'transparent')+'">'+(n||'')+'</td>'});mig+='</tr>'});mig+='</table>';
 const xs=L.filter(o=>o.R<12&&o.mix<=2&&!o.p.Applied&&o.m12>50e3).sort((a,b)=>b.m12-a.m12);
 const wb=L.filter(o=>['At Risk','Cannot Lose'].includes(o.seg)).sort((a,b)=>b.m12p-a.m12p);
 const lever=[['Retain (Champions, Loyal)',['Champions','Loyal']],['Grow (Potential, New, Promising)',['Potential Loyalist','New','Promising']],['Reactivate (Need Attention, About to Sleep)',['Need Attention','About to Sleep']],['Win back (At Risk, Cannot Lose)',['At Risk','Cannot Lose']]]
  .map(([k,ss])=>{const x=L.filter(o=>ss.includes(o.seg));const base=x.reduce((s,o)=>s+o.m12,0),pr=x.reduce((s,o)=>s+o.m12p,0);
   const up=k.startsWith('Retain')?base*.05:k.startsWith('Grow')?base*.25:k.startsWith('React')?Math.max(0,pr-base)*.4:pr*.3;return{k,n:x.length,base,pr,up}});
 document.getElementById('v-cvm').innerHTML='<div class="grid"><div class="card"><h3>Value levers — 12-month upside</h3><p class="sub">assumptions: retain +5%, grow +25%, reactivate 40% of lost run-rate, win back 30% of prior-year revenue</p>'+
 table(lever,[['Lever',r=>r.k],['Customers',r=>r.n],['Last 12m',r=>fmt(r.base)],['Prior 12m',r=>fmt(r.pr)],['Upside',r=>'<b>'+fmt(r.up)+'</b>']])+'<div class="cv" style="height:200px;margin-top:10px"><canvas id="c6"></canvas></div></div>'+
 '<div class="card"><h3>Segment migration (12 months)</h3><p class="sub">green = moved up, red = moved down; rows = segment a year ago</p><div class="tw">'+mig+'</div></div></div>'+
 '<div class="grid" style="margin-top:14px"><div class="card"><h3>Win-back list</h3><p class="sub">At Risk / Cannot Lose, by revenue lost</p>'+table(wb.slice(0,12),[['Customer',r=>nm(r)],['Team',r=>C[r.c].team],['Segment',r=>chip(r.seg)],['Months silent',r=>r.R],['Prior 12m',r=>fmt(r.m12p)],['Last 12m',r=>fmt(r.m12)]])+'</div>'+
 '<div class="card"><h3>Cross-sell: Applied not yet bought</h3><p class="sub">active DX buyers (≥50K last 12m) with no Applied invoicing</p>'+table(xs.slice(0,12),[['Customer',r=>nm(r)],['Team',r=>C[r.c].team],['Buys',r=>Object.keys(r.p).join(', ')],['Last 12m',r=>fmt(r.m12)],['Segment',r=>chip(r.seg)]])+'</div></div>';
 chart('c6',{type:'bar',data:{labels:lever.map(l=>l.k.split(' (')[0]),datasets:[{data:lever.map(l=>l.up),backgroundColor:[css('--good'),css('--acc'),css('--warn'),css('--bad')]}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>fmt(v)}}}}});
}
/* ---------------- controls ---------------- */
fTeam.innerHTML=['All',...TEAMS].map(t=>'<option>'+t+'</option>').join('');
fProd.innerHTML=['All',...PRODS].map(t=>'<option>'+t+'</option>').join('');
document.getElementById('src').textContent=DATA.note;fAsof.innerHTML=months.filter(m=>m>=DATA.minAsof&&m<=DATA.asof).reverse().map(m=>'<option value="'+m+'">'+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m%100-1]+' '+Math.floor(m/100)+'</option>').join('');
const tabs=[['rfm','RFM'],['seg','Segmentation'],['cltv','CLTV'],['cvm','Value management']];
nav.innerHTML=tabs.map((t,i)=>'<button data-v="'+t[0]+'"'+(i?'':' class="on"')+'>'+t[1]+'</button>').join('');
nav.onclick=e=>{const b=e.target.closest('button');if(!b)return;nav.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
 document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+b.dataset.v));render()};
[fTeam,fProd,fAsof].forEach(s=>s.onchange=render);
theme.onclick=()=>{const r=document.documentElement;r.dataset.theme=(r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))==='dark'?'light':'dark';render()};
render();
</script></body></html>
